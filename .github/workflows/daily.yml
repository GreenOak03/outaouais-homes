name: Daily Outaouais Home Refresh
on:
  schedule:
    - cron: '0 11 * * *' # 6:00 AM EST every day
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright beautifulsoup4 requests && playwright install chromium
      - run: python refresh_outaouais.py
      - run: |
          git config user.name "daily-home-bot"
          git config user.email "bot@users.noreply.github.com"
          git add snapshot.json
          git diff --staged --quiet || git commit -m "Daily refresh $(date -u +%F)"
          git push
